(() => {
  try {
    const url = new URL(window.location.href);
    const ticket = url.searchParams.get("ticket");
    if (!ticket || !ticket.trim()) {
      return;
    }

    window.__TRANSLAY_PORTAL_TICKET__ = ticket.trim();
    url.searchParams.delete("ticket");
    window.history.replaceState({}, document.title, `${url.pathname}${url.search}${url.hash}`);
  } catch (_) {
    window.__TRANSLAY_PORTAL_TICKET__ = "";
  }
})();

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

function formatSubscriptionDate(iso) {
  if (typeof iso !== "string" || !iso.trim()) {
    return "";
  }

  const parsed = new Date(iso);
  if (Number.isNaN(parsed.getTime())) {
    return "";
  }

  return new Intl.DateTimeFormat(document.documentElement.lang || "en", {
    year: "numeric",
    month: "long",
    day: "numeric",
  }).format(parsed);
}

function fillTemplate(template, values) {
  return String(template || "").replace(/\{(\w+)\}/g, (_match, key) => {
    return Object.prototype.hasOwnProperty.call(values, key) ? values[key] : "";
  });
}

function readPositiveInteger(value) {
  if (typeof value === "number") {
    return Number.isInteger(value) && value > 0 ? value : null;
  }
  if (typeof value !== "string") {
    return null;
  }
  const trimmed = value.trim();
  if (!/^\d+$/.test(trimmed)) {
    return null;
  }
  const parsed = Number(trimmed);
  return Number.isInteger(parsed) && parsed > 0 ? parsed : null;
}

function readCompletedCreditQuantity(event) {
  const customData = event?.detail?.data?.custom_data || event?.detail?.custom_data || {};
  return readPositiveInteger(customData.quantity);
}

function sleep(ms) {
  return new Promise((resolve) => window.setTimeout(resolve, ms));
}

function formatCreditRefundAmount(balance) {
  const creditSku = window.TransLayLandingConfig?.getCreditSku?.("slides") || {};
  const amountCents = Number.isInteger(creditSku.amountCents) ? creditSku.amountCents : 4;
  const pendingUnits = Number(balance?.pending_refund_units) || 0;
  return `$${((pendingUnits * amountCents) / 100).toFixed(2)}`;
}

const ButtonTextFit = (() => {
  const MIN_FONT_SIZE = 8;
  let timerId = 0;
  let resizeInstalled = false;
  let observer = null;

  function isVisible(element) {
    return element.getClientRects().length > 0 && element.clientWidth > 0;
  }

  function getHorizontalPadding(element) {
    const styles = window.getComputedStyle(element);
    return (
      (Number.parseFloat(styles.paddingLeft) || 0) +
      (Number.parseFloat(styles.paddingRight) || 0)
    );
  }

  function getAvailableContentWidth(element) {
    return Math.max(1, element.clientWidth - getHorizontalPadding(element));
  }

  function measureContentWidth(button) {
    const range = document.createRange();
    range.selectNodeContents(button);
    const width = Math.max(1, range.getBoundingClientRect().width);
    range.detach?.();
    return width;
  }

  function hasChineseButtonText(groupButtons) {
    return groupButtons.some((button) => /[\u3400-\u9fff\uf900-\ufaff]/.test(button.textContent || ""));
  }

  function hasConstrainedButton(groupButtons) {
    return groupButtons.some((button) => {
      return measureContentWidth(button) > getAvailableContentWidth(button) + 1;
    });
  }

  function fit() {
    timerId = 0;
    const buttons = Array.from(document.querySelectorAll("[data-fit-button-group]"))
      .filter((element) => element instanceof HTMLElement && isVisible(element));
    if (!buttons.length) {
      return;
    }

    buttons.forEach((button) => {
      button.style.fontSize = "";
    });

    const groups = new Map();
    buttons.forEach((button) => {
      const group = button.getAttribute("data-fit-button-group") || "default";
      if (!groups.has(group)) {
        groups.set(group, []);
      }
      groups.get(group).push(button);
    });

    const activeLang = String(document.documentElement.lang || "").toLowerCase();
    const isChineseLocale = activeLang === "zh" || activeLang.startsWith("zh-");
    groups.forEach((groupButtons) => {
      if (isChineseLocale && hasChineseButtonText(groupButtons)) {
        return;
      }

      if (!hasConstrainedButton(groupButtons)) {
        return;
      }

      let targetSize = Infinity;
      groupButtons.forEach((button) => {
        const baseSize = Number.parseFloat(window.getComputedStyle(button).fontSize) || 14.5;
        const availableTextWidth = getAvailableContentWidth(button);
        const intrinsicTextWidth = measureContentWidth(button);
        const fitSize =
          intrinsicTextWidth > availableTextWidth + 1
            ? Math.max(MIN_FONT_SIZE, baseSize * (availableTextWidth / intrinsicTextWidth))
            : baseSize;
        targetSize = Math.min(targetSize, fitSize);
      });

      if (!Number.isFinite(targetSize)) {
        return;
      }

      let roundedSize = Math.max(MIN_FONT_SIZE, Math.floor(targetSize * 10) / 10);
      for (let attempt = 0; attempt < 8; attempt += 1) {
        groupButtons.forEach((button) => {
          button.style.fontSize = `${roundedSize}px`;
        });

        let nextSize = roundedSize;
        let hasOverflow = false;
        groupButtons.forEach((button) => {
          const availableTextWidth = getAvailableContentWidth(button);
          const intrinsicTextWidth = measureContentWidth(button);
          if (intrinsicTextWidth <= availableTextWidth + 1) {
            return;
          }
          hasOverflow = true;
          nextSize = Math.min(nextSize, roundedSize * (availableTextWidth / intrinsicTextWidth));
        });

        if (!hasOverflow) {
          break;
        }

        const adjustedSize = Math.max(MIN_FONT_SIZE, Math.floor(nextSize * 10) / 10);
        if (adjustedSize >= roundedSize || adjustedSize <= MIN_FONT_SIZE) {
          roundedSize = adjustedSize;
          groupButtons.forEach((button) => {
            button.style.fontSize = `${roundedSize}px`;
          });
          break;
        }
        roundedSize = adjustedSize;
      }
    });
  }

  function schedule() {
    if (timerId) {
      return;
    }
    timerId = window.setTimeout(fit, 0);
  }

  function install(root) {
    if (!resizeInstalled) {
      resizeInstalled = true;
      window.addEventListener("resize", schedule, { passive: true });
      document.fonts?.ready?.then(schedule).catch(() => {});
    }
    if (observer || !root) {
      schedule();
      return;
    }
    observer = new MutationObserver(schedule);
    observer.observe(root, { childList: true, subtree: true, characterData: true });
    schedule();
  }

  return { install, schedule };
})();

window.TransLayButtonTextFit = ButtonTextFit;

function App() {
  const { lang, t, setLang } = useI18n();
  const { theme, setTheme } = useTheme();
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [tweaks, setTweaks] = useTweaks({
    hero: "A",
    motion: 1,
    accent: "blue",
    font: "default",
    space: 1,
    hero_size: 1,
  });
  const [authState, setAuthState] = useState(() => ({
    ...(window.TransLayLandingSession.readAuthSnapshot?.() || {
      status: "loading",
      user: null,
      planType: "free",
      subscriptionStatus: "active",
      subscription: null,
      creditBalance: null,
      errorMessage: "",
    }),
  }));
  const [checkoutNotice, setCheckoutNotice] = useState("");
  const [subscriptionSuccessPlan, setSubscriptionSuccessPlan] = useState(() =>
    window.TransLayLandingCheckout?.readSuccessfulPlan?.() || ""
  );
  const [successDialogPlan, setSuccessDialogPlan] = useState(() =>
    window.TransLayLandingCheckout?.readPendingSuccessDialogPlan?.() || ""
  );
  const successDialogOpen = Boolean(successDialogPlan);
  const [cancelDialogPlan, setCancelDialogPlan] = useState("");
  const [upgradeDialogMode, setUpgradeDialogMode] = useState("");
  const [upgradeDialogMessage, setUpgradeDialogMessage] = useState("");
  const [creditActionCompletedKey, setCreditActionCompletedKey] = useState(0);
  const creditBalanceRef = useRef(authState.creditBalance);
  const pendingCreditPurchaseRef = useRef(null);

  useEffect(() => {
    window.TransLayButtonTextFit?.install(document.getElementById("app"));
  }, []);

  useEffect(() => {
    window.TransLayButtonTextFit?.schedule();
  }, [
    lang,
    t,
    upgradeDialogMode,
    cancelDialogPlan,
    successDialogOpen,
    authState,
    authState.creditBalance,
    checkoutNotice,
    creditActionCompletedKey,
  ]);

  useEffect(() => {
    document.title = t.meta?.document_title || "";
  }, [t.meta?.document_title]);

  useEffect(() => {
    creditBalanceRef.current = authState.creditBalance;
  }, [authState.creditBalance]);

  const applyCreditBalance = useCallback((balance, { clearError = true } = {}) => {
    setAuthState((prev) => {
      const next = {
        ...prev,
        creditBalance: balance,
        ...(clearError ? { errorMessage: "" } : {}),
      };
      window.TransLayLandingSession.writeAuthSnapshot?.(next);
      return next;
    });
  }, []);

  const fetchCreditBalanceUntil = useCallback(async (expectedMinimumBalance = null) => {
    const retryDelays = [0, 1500, 2000, 3000, 4000, 5000, 7000, 9000];
    let lastBalance = null;

    for (let attempt = 0; attempt < retryDelays.length; attempt += 1) {
      if (retryDelays[attempt] > 0) {
        await sleep(retryDelays[attempt]);
      }

      lastBalance = await window.TransLayLandingSession.fetchCreditBalance();
      const balanceValue = Number(lastBalance?.balance);
      if (
        expectedMinimumBalance === null ||
        !Number.isFinite(expectedMinimumBalance) ||
        (Number.isFinite(balanceValue) && balanceValue >= expectedMinimumBalance)
      ) {
        return { balance: lastBalance, confirmed: true };
      }
    }

    return { balance: lastBalance, confirmed: false };
  }, []);

  useEffect(() => {
    if (authState.status !== "signed_in") {
      return undefined;
    }
    const pendingRefundUnits = Number(authState.creditBalance?.pending_refund_units) || 0;
    if (pendingRefundUnits <= 0) {
      return undefined;
    }

    let cancelled = false;
    let refreshTimer = 0;
    const scheduleRefresh = (delayMs) => {
      refreshTimer = window.setTimeout(refreshPendingRefundBalance, delayMs);
    };
    const refreshPendingRefundBalance = async () => {
      try {
        const balance = await window.TransLayLandingSession.fetchCreditBalance();
        if (cancelled) {
          return;
        }

        applyCreditBalance(balance, { clearError: false });
        const nextPendingRefundUnits = Number(balance?.pending_refund_units) || 0;
        if (nextPendingRefundUnits > 0) {
          setCheckoutNotice(
            fillTemplate(
              t.pricing.credits_refund_processing_banner ||
                "Refund submitted. Refunds in progress: {units}. Estimated refund: {amount}.",
              {
                units: String(nextPendingRefundUnits),
                amount: formatCreditRefundAmount(balance),
              }
            )
          );
          scheduleRefresh(30000);
        } else {
          setCheckoutNotice("");
        }
      } catch (_) {
        if (!cancelled) {
          scheduleRefresh(30000);
        }
      }
    };

    scheduleRefresh(5000);
    return () => {
      cancelled = true;
      window.clearTimeout(refreshTimer);
    };
  }, [applyCreditBalance, authState.creditBalance?.pending_refund_units, authState.status, t]);

  // Tweaks protocol with host toolbar
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === "__activate_edit_mode") setTweaksOpen(true);
      if (d.type === "__deactivate_edit_mode") setTweaksOpen(false);
    };
    window.addEventListener("message", onMsg);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", onMsg);
  }, []);

  useEffect(() => {
    const completedEvent = window.TransLayLandingCheckoutEvents?.completed;
    const errorEvent = window.TransLayLandingCheckoutEvents?.error;
    if (!completedEvent || !errorEvent) {
      return;
    }

    let refreshTimer = 0;

    const handleCompleted = (event) => {
      const completedPlan = event?.detail?.data?.custom_data?.sku || event?.detail?.custom_data?.sku || "";
      const completedCredits = completedPlan === "slides";
      const pendingCreditPurchase = pendingCreditPurchaseRef.current;
      const completedCreditQuantity =
        readCompletedCreditQuantity(event) || pendingCreditPurchase?.quantity || null;
      const previousCreditBalance =
        typeof pendingCreditPurchase?.previousBalance === "number"
          ? pendingCreditPurchase.previousBalance
          : Number(creditBalanceRef.current?.balance);
      const expectedCreditBalance =
        completedCredits && completedCreditQuantity
          ? Number.isFinite(previousCreditBalance)
            ? previousCreditBalance + completedCreditQuantity
            : completedCreditQuantity
          : null;
      const creditsReceivedNotice =
        t.pricing.credits_purchase_received_notice ||
        "Credit purchase received. Confirming your balance...";
      if (completedCredits) {
        window.TransLayLandingCheckout?.clearPendingSuccessDialog?.();
      } else if (completedPlan) {
        window.TransLayLandingCheckout?.rememberSuccessfulPlan?.(completedPlan);
        window.TransLayLandingCheckout?.rememberPendingSuccessDialog?.(completedPlan);
        setSubscriptionSuccessPlan(completedPlan);
        setSuccessDialogPlan(completedPlan);
      }
      setCheckoutNotice(
        completedCredits
          ? creditsReceivedNotice
          : t.pricing.purchase_received_notice
      );
      setAuthState((prev) => ({
        ...prev,
        errorMessage: completedCredits
          ? creditsReceivedNotice
          : t.pricing.purchase_received_notice,
      }));
      if (completedCredits && completedCreditQuantity) {
        const currentCreditBalance = creditBalanceRef.current || {};
        const currentBalance = Number(currentCreditBalance.balance);
        const currentRefundable = Number(currentCreditBalance.refundable_units);
        const optimisticBalance = Number.isFinite(currentBalance)
          ? currentBalance + completedCreditQuantity
          : completedCreditQuantity;
        const optimisticRefundable = Number.isFinite(currentRefundable)
          ? currentRefundable + completedCreditQuantity
          : optimisticBalance;
        applyCreditBalance(
          {
            unit: "slides_pages",
            ...currentCreditBalance,
            balance: optimisticBalance,
            refundable_units: optimisticRefundable,
            pending_refund_units: Number(currentCreditBalance.pending_refund_units) || 0,
          },
          { clearError: false }
        );
        setCreditActionCompletedKey((value) => value + 1);
      }
      refreshTimer = window.setTimeout(async () => {
        const acceptedPlans = new Set(["pro_monthly", "pro_yearly"]);
        const retryDelays = [1500, 2000, 3000, 4000, 5000, 6000];

        for (let attempt = 0; attempt < retryDelays.length; attempt += 1) {
          try {
            const payload = await window.TransLayLandingSession.fetchSessionMe();
            setAuthState(window.TransLayLandingSession.rememberSessionState(payload));
            if (completedCredits) {
              const result = await fetchCreditBalanceUntil(expectedCreditBalance);
              if (!result.confirmed && expectedCreditBalance !== null) {
                const message = t.pricing.subscription_confirmation_delayed_notice;
                setCheckoutNotice(message);
                setAuthState((prev) => ({
                  ...prev,
                  errorMessage: message,
                }));
                return;
              }
              applyCreditBalance(result.balance);
              pendingCreditPurchaseRef.current = null;
              setCreditActionCompletedKey((value) => value + 1);
              setCheckoutNotice("");
              return;
            }
            if (acceptedPlans.has(payload?.plan_type || "")) {
              setSubscriptionSuccessPlan(payload.plan_type);
              setCheckoutNotice("");
              return;
            }
          } catch (error) {
            if (attempt === retryDelays.length - 1) {
              const message =
                error?.message || t.pricing.subscription_confirmation_delayed_notice;
              setCheckoutNotice(message);
              setAuthState((prev) => ({
                ...prev,
                errorMessage: message,
              }));
              return;
            }
          }

          await new Promise((resolve) => {
            refreshTimer = window.setTimeout(resolve, retryDelays[attempt]);
          });
        }

        const delayedMessage = t.pricing.subscription_confirmation_delayed_notice;
        setCheckoutNotice(delayedMessage);
        setAuthState((prev) => ({
          ...prev,
          errorMessage: delayedMessage,
        }));
      }, 1000);
    };

    const handleCheckoutError = (event) => {
      pendingCreditPurchaseRef.current = null;
      const eventName = event?.detail?.name || "";
      const message =
        eventName === "checkout.payment.failed" || eventName === "checkout.payment.error"
          ? t.pricing.payment_failed_notice
          : t.pricing.checkout_unavailable_notice;
      setCheckoutNotice(message);
      setAuthState((prev) => ({ ...prev, errorMessage: message }));
    };

    window.addEventListener(completedEvent, handleCompleted);
    window.addEventListener(errorEvent, handleCheckoutError);
    return () => {
      window.clearTimeout(refreshTimer);
      window.removeEventListener(completedEvent, handleCompleted);
      window.removeEventListener(errorEvent, handleCheckoutError);
    };
  }, [applyCreditBalance, fetchCreditBalanceUntil, t]);

  useEffect(() => {
    let cancelled = false;

    const bootstrapSession = async () => {
      const ticket = window.TransLayLandingSession.getTicketFromLocation();
      if (ticket) {
        setAuthState((prev) => ({ ...prev, status: "consuming_ticket", errorMessage: "" }));
        window.TransLayLandingSession.stripTicketFromUrl();
        try {
          const payload = await window.TransLayLandingSession.consumeTicket(ticket);
          if (!cancelled) {
            const state = window.TransLayLandingSession.rememberSessionState(payload);
            setAuthState(state);
            if (state.status === "signed_in") {
              window.TransLayLandingSession.fetchCreditBalance()
                .then((balance) => {
                  if (!cancelled) {
                    applyCreditBalance(balance, { clearError: false });
                  }
                })
                .catch(() => {});
            }
          }
          return;
        } catch (error) {
          if (!cancelled) {
            setAuthState(
              window.TransLayLandingSession.buildSignedOutState(error?.message || "Unable to sign you in.")
            );
          }
          return;
        }
      }

      const hydratedSnapshot = window.TransLayLandingSession.readAuthSnapshot?.() || null;
      try {
        const payload = await window.TransLayLandingSession.fetchSessionMe();
        if (!cancelled) {
          const state = window.TransLayLandingSession.normalizeSessionState(payload);
          if (state.status === "signed_in") {
            setAuthState(window.TransLayLandingSession.rememberSessionState(payload));
            window.TransLayLandingSession.fetchCreditBalance()
              .then((balance) => {
                if (!cancelled) {
                  applyCreditBalance(balance, { clearError: false });
                }
              })
              .catch(() => {});
            if (payload.plan_type === "pro_monthly" || payload.plan_type === "pro_yearly") {
              setSubscriptionSuccessPlan(payload.plan_type);
            }
            return;
          }

          window.TransLayLandingSession.clearAuthSnapshot?.();
          setAuthState(state);
        }
      } catch (error) {
        if (!cancelled) {
          if (hydratedSnapshot) {
            setAuthState(hydratedSnapshot);
          } else {
            setAuthState(
              window.TransLayLandingSession.buildSignedOutState(error?.message || "Unable to check session.")
            );
          }
        }
      }
    };

    bootstrapSession();
    return () => {
      cancelled = true;
    };
  }, [applyCreditBalance]);

  useEffect(() => {
    let retryTimer = 0;

    const scrollToCurrentHash = () => {
      const hash = window.location.hash;
      if (!hash) {
        return true;
      }

      const targetId = decodeURIComponent(hash.slice(1));
      if (!targetId) {
        return true;
      }

      const target = document.getElementById(targetId);
      if (!target) {
        return false;
      }

      target.scrollIntoView({ block: "start", behavior: "auto" });
      return true;
    };

    const syncHashNavigation = () => {
      window.clearTimeout(retryTimer);
      let attempts = 0;

      const tryScroll = () => {
        if (scrollToCurrentHash() || attempts >= 20) {
          return;
        }

        attempts += 1;
        retryTimer = window.setTimeout(tryScroll, 120);
      };

      tryScroll();
    };

    syncHashNavigation();
    window.addEventListener("hashchange", syncHashNavigation);
    return () => {
      window.clearTimeout(retryTimer);
      window.removeEventListener("hashchange", syncHashNavigation);
    };
  }, []);

  const handleGoogleCredential = useCallback(async (credential) => {
    setCheckoutNotice("");
    setAuthState((prev) => ({ ...prev, status: "signing_in", errorMessage: "" }));
    try {
      const payload = await window.TransLayLandingSession.loginWithGoogleCredential(credential);
      setAuthState(window.TransLayLandingSession.rememberSessionState(payload));
      window.TransLayLandingSession.fetchCreditBalance()
        .then((balance) => {
          applyCreditBalance(balance, { clearError: false });
        })
        .catch(() => {});
      if (payload.plan_type === "pro_monthly" || payload.plan_type === "pro_yearly") {
        setSubscriptionSuccessPlan(payload.plan_type);
      }
    } catch (error) {
      setAuthState(
        window.TransLayLandingSession.buildSignedOutState(error?.message || "Unable to complete sign-in.")
      );
    }
  }, [applyCreditBalance]);

  const handleLogout = useCallback(async () => {
    try {
      await window.TransLayLandingSession.logout();
    } catch (error) {
      console.warn("Portal logout failed:", error?.message || error);
    }
    window.TransLayLandingSession.clearAuthSnapshot?.();
    setCheckoutNotice("");
    setSubscriptionSuccessPlan("");
    setSuccessDialogPlan("");
    window.TransLayLandingCheckout?.clearSuccessfulPlan?.();
    window.TransLayLandingCheckout?.clearPendingSuccessDialog?.();
    setAuthState(window.TransLayLandingSession.buildSignedOutState(""));
  }, []);

  const handlePlanCheckout = useCallback(async (planType, options = {}) => {
    if (authState.status !== "signed_in" || !authState.user) {
      const localizedMessage = t.pricing.sign_in_required_notice;
      setCheckoutNotice(localizedMessage);
      setAuthState((prev) => ({
        ...prev,
        errorMessage: localizedMessage,
      }));
      document.getElementById("pricing")?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    try {
      if (authState.planType === "pro_monthly" || authState.planType === "pro_yearly") {
        if (options.confirmUpgradeCharge) {
          setCheckoutNotice("");
          setUpgradeDialogMessage("");
          setUpgradeDialogMode("processing");
        } else {
          setCheckoutNotice(t.pricing.subscription_change_pending_notice);
        }
        const payload = await window.TransLayLandingSession.changeSubscriptionPlan(planType, {
          confirmUpgradeCharge: Boolean(options.confirmUpgradeCharge),
        });
        if (payload?.billing_action?.type === "confirm_upgrade_charge") {
          setUpgradeDialogMessage(
            fillTemplate(t.pricing.upgrade_notice_body, {
              amount: payload.billing_action.formatted_amount,
            })
          );
          setUpgradeDialogMode("confirm");
          setCheckoutNotice("");
          return;
        }
        window.TransLayLandingCheckout?.rememberSuccessfulPlan?.(planType);
        setSubscriptionSuccessPlan(planType);
        setAuthState(window.TransLayLandingSession.rememberSessionState(payload));
        if (payload?.billing_action?.type === "upgrade_charged") {
          const formattedDate = formatSubscriptionDate(
            payload?.subscription?.current_period_end || ""
          );
          setUpgradeDialogMessage(
            fillTemplate(t.pricing.upgrade_completed_body, {
              date: formattedDate,
            })
          );
          setUpgradeDialogMode("success");
          setCheckoutNotice("");
        } else if (payload?.subscription?.cancel_at_period_end === false && planType === authState.planType) {
          setCheckoutNotice(t.pricing.subscription_resumed_notice);
        } else {
          setCheckoutNotice("");
        }
        return;
      }

      setCheckoutNotice(t.pricing.opening_checkout_notice);
      await window.TransLayLandingCheckout.openSubscriptionCheckout({
        planType,
        email: authState.user.email || "",
        locale: lang,
      });
    } catch (error) {
      const message = error?.message || t.pricing.checkout_unavailable_notice;
      if (options.confirmUpgradeCharge) {
        setUpgradeDialogMessage(message);
        setUpgradeDialogMode("error");
      } else {
        setCheckoutNotice(message);
        setAuthState((prev) => ({
          ...prev,
          errorMessage: message,
        }));
      }
    }
  }, [applyCreditBalance, authState, lang, t]);

  const handleCreditsCheckout = useCallback(async (quantity) => {
    if (authState.status !== "signed_in" || !authState.user) {
      const localizedMessage = t.pricing.sign_in_required_notice;
      setCheckoutNotice(localizedMessage);
      setAuthState((prev) => ({
        ...prev,
        errorMessage: localizedMessage,
      }));
      document.getElementById("pricing")?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    try {
      let previousBalance = Number(creditBalanceRef.current?.balance);
      if (!Number.isFinite(previousBalance)) {
        try {
          const balance = await window.TransLayLandingSession.fetchCreditBalance();
          previousBalance = Number(balance?.balance);
          applyCreditBalance(balance, { clearError: false });
        } catch (_) {
          previousBalance = null;
        }
      }
      pendingCreditPurchaseRef.current = {
        quantity,
        previousBalance: Number.isFinite(previousBalance) ? previousBalance : null,
      };
      setCheckoutNotice(t.pricing.opening_checkout_notice);
      await window.TransLayLandingCheckout.openCreditsCheckout({
        sku: "slides",
        quantity,
        email: authState.user.email || "",
        locale: lang,
      });
    } catch (error) {
      pendingCreditPurchaseRef.current = null;
      const message = error?.message || t.pricing.checkout_unavailable_notice;
      setCheckoutNotice(message);
      setAuthState((prev) => ({
        ...prev,
        errorMessage: message,
      }));
    }
  }, [authState, lang, t]);

  const handleCreditRefund = useCallback(async (quantity) => {
    if (authState.status !== "signed_in" || !authState.user) {
      const localizedMessage = t.pricing.sign_in_required_notice;
      setCheckoutNotice(localizedMessage);
      setAuthState((prev) => ({
        ...prev,
        errorMessage: localizedMessage,
      }));
      document.getElementById("pricing")?.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }

    try {
      setCheckoutNotice(t.pricing.credits_refund_pending_notice || "Submitting refund request...");
      const refund = await window.TransLayLandingSession.requestCreditRefund(quantity);
      const balance = await window.TransLayLandingSession.fetchCreditBalance();
      applyCreditBalance(balance);
      setCreditActionCompletedKey((value) => value + 1);
      setCheckoutNotice(
        refund?.status === "submitted"
          ? fillTemplate(
              t.pricing.credits_refund_processing_banner ||
                "Refund submitted. Refunds in progress: {units}. Estimated refund: {amount}.",
              {
                units: String(balance?.pending_refund_units ?? quantity),
                amount: formatCreditRefundAmount(balance),
              }
            )
          : t.pricing.credits_refund_submitted_notice || "Refund completed."
      );
    } catch (error) {
      const message = error?.message || t.pricing.checkout_unavailable_notice;
      setCheckoutNotice(message);
      setAuthState((prev) => ({
        ...prev,
        errorMessage: message,
      }));
    }
  }, [applyCreditBalance, authState, t]);

  const handleConfirmUpgrade = useCallback(async () => {
    setUpgradeDialogMode("processing");
    setUpgradeDialogMessage("");
    await handlePlanCheckout("pro_yearly", { action: "upgrade", confirmUpgradeCharge: true });
  }, [handlePlanCheckout]);

  const handlePlanCancel = useCallback(() => {
    setCancelDialogPlan(authState.planType === "pro_yearly" ? "pro_yearly" : "pro_monthly");
  }, [authState.planType]);

  const handleConfirmCancel = useCallback(async () => {
    try {
      const payload = await window.TransLayLandingSession.cancelSubscription();
      if (payload?.billing_action?.type === "redirect" && payload.billing_action.url) {
        setCancelDialogPlan("");
        setCheckoutNotice(t.pricing.cancellation_redirect_notice);
        window.location.assign(payload.billing_action.url);
        return;
      }

      const nextState = window.TransLayLandingSession.rememberSessionState(payload);
      setAuthState(nextState);
      setCancelDialogPlan("");
      const formattedDate = formatSubscriptionDate(
        payload?.subscription?.current_period_end || nextState?.subscription?.currentPeriodEnd || ""
      );
      setCheckoutNotice(
        fillTemplate(t.pricing.cancellation_scheduled_notice, {
          date: formattedDate,
        })
      );
    } catch (error) {
      const message = error?.message || t.pricing.cancellation_failed_notice;
      setCheckoutNotice(message);
      setAuthState((prev) => ({
        ...prev,
        errorMessage: message,
      }));
    }
  }, [t]);

  const subscriptionState = {
    currentPlanType:
      authState.planType === "pro_monthly" || authState.planType === "pro_yearly"
        ? authState.planType
        : subscriptionSuccessPlan,
    cancelAtPeriodEnd: Boolean(authState.subscription?.cancelAtPeriodEnd),
  };

  const successDialogMessage =
    successDialogPlan === "pro_yearly"
      ? t.pricing.subscription_success_body_yearly
      : t.pricing.subscription_success_body_monthly;
  const cancelDialogMessage =
    cancelDialogPlan === "pro_yearly"
      ? t.pricing.cancel_dialog_body_yearly
      : t.pricing.cancel_dialog_body_monthly;
  const upgradeConfirmMessage = fillTemplate(t.pricing.upgrade_notice_body, {
    amount: "$110.00",
  });

  return (
    <>
      <AnimatedBG />
      {upgradeDialogMode ? (
        <div className="modal-backdrop" role="presentation">
          <div className="modal-card" role="dialog" aria-modal="true" aria-labelledby="subscription-upgrade-title">
            <h3 id="subscription-upgrade-title" className="modal-title">
              {upgradeDialogMode === "processing"
                ? t.pricing.upgrade_processing_title
                : upgradeDialogMode === "success"
                  ? t.pricing.upgrade_completed_title
                  : upgradeDialogMode === "error"
                    ? t.pricing.upgrade_failed_title
                    : t.pricing.upgrade_notice_title}
            </h3>
            <p className="modal-body">
              {upgradeDialogMode === "processing"
                ? t.pricing.upgrade_processing_body
                : upgradeDialogMode === "success" || upgradeDialogMode === "error"
                  ? upgradeDialogMessage
                  : upgradeDialogMessage || upgradeConfirmMessage}
            </p>
            {upgradeDialogMode === "processing" ? null : (
              <div className={upgradeDialogMode === "confirm" ? "modal-actions modal-actions-compact" : "modal-actions"}>
                {upgradeDialogMode === "confirm" ? (
                  <>
                    <button
                      type="button"
                      className="btn btn-primary"
                      data-fit-button-group="upgrade-dialog-actions"
                      onClick={handleConfirmUpgrade}
                    >
                      {t.pricing.upgrade_notice_confirm}
                    </button>
                    <button
                      type="button"
                      className="btn btn-ghost"
                      data-fit-button-group="upgrade-dialog-actions"
                      onClick={() => {
                        setUpgradeDialogMode("");
                        setUpgradeDialogMessage("");
                      }}
                    >
                      {t.pricing.upgrade_notice_cancel}
                    </button>
                  </>
                ) : (
                  <button
                    type="button"
                    className="btn btn-primary"
                    data-fit-button-group="upgrade-dialog-single"
                    onClick={() => {
                      setUpgradeDialogMode("");
                      setUpgradeDialogMessage("");
                    }}
                  >
                    {upgradeDialogMode === "success"
                      ? t.pricing.upgrade_completed_confirm
                      : t.pricing.upgrade_failed_confirm}
                  </button>
                )}
              </div>
            )}
          </div>
        </div>
      ) : null}
      {cancelDialogPlan ? (
        <div className="modal-backdrop" role="presentation">
          <div className="modal-card" role="dialog" aria-modal="true" aria-labelledby="subscription-cancel-title">
            <h3 id="subscription-cancel-title" className="modal-title">{t.pricing.cancel_dialog_title}</h3>
            <p className="modal-body">{cancelDialogMessage}</p>
            <div className="modal-actions">
              <button
                type="button"
                className="btn btn-primary"
                data-fit-button-group="cancel-dialog-actions"
                onClick={handleConfirmCancel}
              >
                {t.pricing.cancel_dialog_confirm}
              </button>
              <button
                type="button"
                className="btn btn-ghost"
                data-fit-button-group="cancel-dialog-actions"
                onClick={() => setCancelDialogPlan("")}
              >
                {t.pricing.cancel_dialog_dismiss}
              </button>
            </div>
          </div>
        </div>
      ) : null}
      {successDialogOpen ? (
        <div className="modal-backdrop" role="presentation">
          <div className="modal-card" role="dialog" aria-modal="true" aria-labelledby="subscription-success-title">
            <h3 id="subscription-success-title" className="modal-title">{t.pricing.subscription_success_title}</h3>
            <p className="modal-body">{successDialogMessage}</p>
            <div className="modal-actions">
              <button
                type="button"
                className="btn btn-primary"
                data-fit-button-group="success-dialog-actions"
                onClick={() => {
                  setSuccessDialogPlan("");
                  window.TransLayLandingCheckout?.clearPendingSuccessDialog?.();
                }}
              >
                {t.pricing.subscription_success_confirm}
              </button>
            </div>
          </div>
        </div>
      ) : null}
      <TopBar
        t={t}
        theme={theme}
        setTheme={setTheme}
        lang={lang}
        setLang={setLang}
        authState={authState}
        onGoogleCredential={handleGoogleCredential}
        onLogout={handleLogout}
      />
      {authState.errorMessage ? (
        <div className="auth-banner">
          <div className="container">
            <div className="auth-banner-card">{authState.errorMessage}</div>
          </div>
        </div>
      ) : null}
      <Hero t={t} variant={tweaks.hero} />
      <FeaturesSection t={t} />
      <DemoSection t={t} />
      <PricingSection
        t={t}
        onPlanCheckout={handlePlanCheckout}
        onCreditsCheckout={handleCreditsCheckout}
        onCreditRefund={handleCreditRefund}
        onPlanCancel={handlePlanCancel}
        checkoutNotice={checkoutNotice}
        subscriptionState={subscriptionState}
        creditBalance={authState.creditBalance}
        creditActionCompletedKey={creditActionCompletedKey}
      />
      <FAQSection t={t} />
      <CTASection t={t} />
      <Footer t={t} />
      <TweaksPanel
        open={tweaksOpen}
        onClose={() => setTweaksOpen(false)}
        state={tweaks}
        setState={setTweaks}
      />
    </>
  );
}

// Wait for all babel scripts to load
setTimeout(() => {
  ReactDOM.createRoot(document.getElementById("app")).render(<App />);
}, 300);
</script>
</body>
</html>
