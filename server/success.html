<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="translay-google-client-id" content="" />
<title>Purchase Complete — TransLay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://accounts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="bg-stage" aria-hidden>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<div class="grain" aria-hidden></div>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M5 7h6M8 5v2M6 13l4-6 4 6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17l3-3 4 4 3-3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
        </svg>
      </span>
      <span>TransLay</span>
    </a>
    <div data-legal-auth-slot class="google-signin-slot"></div>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="card" style="max-width: 760px; margin: 0 auto; text-align: center; padding: 40px 28px;">
      <div class="pill">Payment status</div>
      <h1 style="margin-top: 18px;">Purchase complete</h1>
      <p class="section-sub" style="max-width: 560px; margin: 16px auto 0;">
        Your payment was received. If you started this flow from the Add-on, you can return to Google Slides™ and refresh your entitlement state there.
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px;">
        <a class="btn btn-primary keep" href="/pricing">Back to pricing</a>
        <a class="btn btn-ghost keep" href="/">Go to home</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:none;padding-top:0">
      <div>© 2026 TransLay. All rights reserved.</div>
      <div class="footer-legal">
        <a href="/terms">Terms of Service</a>
        <a href="/privacy">Privacy Policy</a>
      </div>
    </div>
  </div>
</footer>
<script src="js/landing-config.js?v=2"></script>
<script src="js/landing-session.js?v=2"></script>
<script src="js/landing-auth.js?v=2"></script>
<script src="js/legal-auth-shell.js?v=1"></script>
</body>
</html>
