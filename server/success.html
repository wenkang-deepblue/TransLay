<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="translay-google-client-id" content="" />
<title></title>
<link rel="icon" type="image/svg+xml" href="assets/TransLay-logo_48px.svg?v=20260428">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://accounts.google.com">
<link rel="preconnect" href="https://accounts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=15" />
</head>
<body>
<div class="bg-stage" aria-hidden>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>
<div class="grain" aria-hidden></div>

<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="/">
      <span class="brand-mark">
        <img class="brand-mark-image" src="assets/TransLay-logo_48px.png?v=20260428" alt="">
      </span>
	      <span>TransLay</span>
    </a>
    <div class="nav-links" aria-hidden="true"></div>
    <div class="topbar-actions">
      <div data-legal-auth-slot class="google-signin-slot"></div>
      <div data-legal-settings-slot></div>
    </div>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="card" style="max-width: 760px; margin: 0 auto; text-align: center; padding: 40px 28px;">
	      <div class="pill" data-success-kicker></div>
	      <h1 style="margin-top: 18px;" data-success-title></h1>
	      <p class="section-sub" style="max-width: 560px; margin: 16px auto 0;" data-success-body></p>
	      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px;">
	        <a class="btn btn-primary keep" href="/pricing" data-success-back-pricing></a>
	        <a class="btn btn-ghost keep" href="/" data-success-home></a>
	      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container">
      <div class="footer-bottom footer-bottom-single">
      <div class="footer-left-group">
        <a class="brand footer-brand" href="/"><span class="brand-mark"><img class="brand-mark-image" src="assets/TransLay-logo_48px.png?v=20260428" alt=""></span><span>TransLay</span></a>
        <div data-legal-footer-copyright></div>
        <a class="footer-support-link" href="mailto:support@example.com" data-legal-footer-support>support@example.com</a>
      </div>
      <div class="footer-legal">
        <a href="/support" data-legal-footer-support-page></a>
        <a href="/terms" data-legal-footer-terms></a>
        <a href="/privacy" data-legal-footer-privacy></a>
      </div>
    </div>
  </div>
</footer>
<script src="i18n.js?v=45"></script>
<script src="js/landing-config.js?v=12"></script>
<script src="js/landing-session.js?v=12"></script>
<script src="js/landing-auth.js?v=12"></script>
<script src="js/legal-auth-shell.js?v=14"></script>
<script>
(() => {
  try {
    window.sessionStorage.removeItem("translay.checkout.success.plan");
    window.sessionStorage.removeItem("translay.checkout.success.dialog.plan");
  } catch (_) {}
})();
</script>
</body>
</html>
