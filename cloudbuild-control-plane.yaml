substitutions:
  _REGION: YOUR_GCP_REGION
  _REPOSITORY: YOUR_ARTIFACT_REGISTRY_REPOSITORY
  _IMAGE_TAG: manual

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/control-plane/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/control-plane:${_IMAGE_TAG}'
      - '.'
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/control-plane:${_IMAGE_TAG}'
